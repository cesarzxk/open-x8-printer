[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-x8-printer"
version = "0.1.0"
description = "Controle da impressora termica Marklife X8 (X8-04A1) via Bluetooth SPP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=9", "tkinterdnd2>=0.4"]

[project.optional-dependencies]
fast = ["numpy"]
dev = ["pytest"]

[project.scripts]
x8 = "x8printer.cli:main"
x8-gui = "x8printer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["x8printer*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
