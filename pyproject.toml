[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-x8-printer"
version = "0.1.2"
description = "Controle da impressora termica Marklife X8 (X8-04A1) via Bluetooth SPP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=9", "tkinterdnd2>=0.4", "PyMuPDF>=1.24"]

[project.optional-dependencies]
fast = ["numpy"]
dev = ["pytest"]

[project.scripts]
x8 = "src.cli:main"
x8-gui = "src.gui:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
