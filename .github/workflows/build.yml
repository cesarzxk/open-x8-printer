name: Build e Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3-venv python3-tk

      - name: Ambiente Python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Compilar jbigkit (pbmtojbg estático)
        run: |
          curl -L -o /tmp/jbigkit.tar.gz \
            https://www.cl.cam.ac.uk/~mgk25/jbigkit/download/jbigkit-2.1.tar.gz
          tar -xzf /tmp/jbigkit.tar.gz -C /tmp
          cd /tmp/jbigkit-2.1
          gcc -O2 -static -Ilibjbig -o /tmp/pbmtojbg \
            pbmtools/pbmtojbg.c libjbig/jbig.c libjbig/jbig_ar.c
          mkdir -p "$GITHUB_WORKSPACE/vendor"
          cp /tmp/pbmtojbg "$GITHUB_WORKSPACE/vendor/pbmtojbg"
          file "$GITHUB_WORKSPACE/vendor/pbmtojbg"

      - name: PyInstaller
        run: |
          . .venv/bin/activate
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name open-x8-printer \
            --icon assets/open-x8-printer.png \
            --add-binary "vendor/pbmtojbg:." \
            --collect-all tkinterdnd2 \
            --hidden-import PIL._tkinter_finder \
            --paths . \
            packaging/entry.py

      - name: Empacotar AppImage
        run: |
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/open-x8-printer/* AppDir/usr/bin/
          cp assets/open-x8-printer.png \
             AppDir/usr/share/icons/hicolor/256x256/apps/open-x8-printer.png
          cp assets/open-x8-printer.png AppDir/open-x8-printer.png
          cp assets/open-x8-printer.desktop \
             AppDir/usr/share/applications/open-x8-printer.desktop
          cp assets/open-x8-printer.desktop AppDir/open-x8-printer.desktop
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$(readlink -f "$0")")
          exec "$HERE/usr/bin/open-x8-printer" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -L -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            AppDir open-x8-printer-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: open-x8-printer-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make

      - name: Compilar jbigkit (pbmtojbg estático)
        shell: msys2 {0}
        run: |
          WORK="$(cygpath -u "$GITHUB_WORKSPACE")"
          curl -L -o /tmp/jbigkit.tar.gz \
            https://www.cl.cam.ac.uk/~mgk25/jbigkit/download/jbigkit-2.1.tar.gz
          tar -xzf /tmp/jbigkit.tar.gz -C /tmp
          cd /tmp/jbigkit-2.1
          gcc -O2 -static -Ilibjbig -o /tmp/pbmtojbg.exe \
            pbmtools/pbmtojbg.c libjbig/jbig.c libjbig/jbig_ar.c
          mkdir -p "$WORK/vendor"
          cp /tmp/pbmtojbg.exe "$WORK/vendor/pbmtojbg.exe"

      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name open-x8-printer
          --icon assets/open-x8-printer.ico
          --add-binary "vendor/pbmtojbg.exe;."
          --collect-all tkinterdnd2
          --hidden-import PIL._tkinter_finder
          --paths .
          packaging/entry.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/open-x8-printer.exe
          if-no-files-found: error

  release:
    name: Publicar Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
